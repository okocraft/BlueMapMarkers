name: Component load test

on:
  pull_request:
    paths:
      - '.github/workflows/load-test.yml'
      - 'build.gradle.kts'
      - 'src/main/java/net/okocraft/bluemapmarkers/module/worldguard/**'
      - 'src/test/java/net/okocraft/bluemapmarkers/module/worldguard/**'
  workflow_dispatch:

jobs:
  load-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v5
      - run: ./gradlew loadTest
